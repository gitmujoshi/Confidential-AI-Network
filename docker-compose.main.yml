# Docker Compose file for main CMS services

services:
  # Main Application Database
  postgres-app:
    image: postgres:15
    container_name: postgres-app
    environment:
      POSTGRES_DB: contract_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
      - ./deployment/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - cms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contract_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak Database
  postgres-keycloak:
    image: postgres:15
    container_name: postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - cms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak IAM Server
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak-cms
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8443
      KC_HOSTNAME_ADMIN: localhost
      KC_HOSTNAME_ADMIN_PORT: 8443
      KC_HTTPS_ENABLED: true
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/cert.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/key.pem
      KC_HTTP_ENABLED: false
      KC_HEALTH_ENABLED: true
    command: start-dev --https-enabled=true --https-port=8443 --hostname=localhost --hostname-port=8443 --hostname-admin=localhost --hostname-admin-port=8443
    ports:
      - "8443:8443"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./deployment/keycloak-config:/opt/keycloak/conf
      - ./deployment/keycloak-certs:/opt/keycloak/conf
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    networks:
      - cms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_app_data:
    driver: local
  postgres_keycloak_data:
    driver: local
  keycloak_data:
    driver: local

networks:
  cms-network:
    driver: bridge
