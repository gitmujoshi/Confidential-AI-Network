# Keycloak HTTPS Configuration
# This file configures Keycloak to use HTTPS with the provided certificates

# Database configuration
db=***REMOVED-DB_PASSWORD***
db-url=jdbc:***REMOVED-DB_PASSWORD***ql://***REMOVED-DB_PASSWORD***-***REMOVED-KEYCLOAK_DB_PASSWORD***:5432/***REMOVED-KEYCLOAK_DB_PASSWORD***
db-username=***REMOVED-KEYCLOAK_DB_PASSWORD***
db-password=***REMOVED-KEYCLOAK_DB_PASSWORD***

# HTTPS configuration
https-port=8443
https-certificate-file=/opt/***REMOVED-KEYCLOAK_DB_PASSWORD***/conf/cert.pem
https-certificate-key-file=/opt/***REMOVED-KEYCLOAK_DB_PASSWORD***/conf/key.pem

# HTTP configuration (disabled for HTTPS)
http-enabled=false

# Health checks
health-enabled=true

# Development mode
profile=dev
