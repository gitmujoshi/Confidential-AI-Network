# Keycloak HTTPS Configuration
# This file configures Keycloak to use HTTPS with the provided certificates

# Database configuration
db=postgres
db-url=jdbc:postgresql://postgres-keycloak:5432/keycloak
db-username=keycloak
db-password=keycloak

# HTTPS configuration
https-port=8443
https-certificate-file=/opt/keycloak/conf/cert.pem
https-certificate-key-file=/opt/keycloak/conf/key.pem

# HTTP configuration (disabled for HTTPS)
http-enabled=false

# Health checks
health-enabled=true

# Development mode
profile=dev
