# SCITT ledger service from this repo, scheduled on AKS.
# This is not a Microsoft Confidential Consortium Framework network.
# DATABASE_URL comes from the scitt-db secret. The install script refuses to apply without it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scitt
  namespace: contract-management
  labels:
    app: scitt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scitt
  template:
    metadata:
      labels:
        app: scitt
    spec:
      containers:
        - name: scitt
          image: __SCITT_IMAGE__
          ports:
            - containerPort: 9000
          env:
            - name: PORT
              value: "9000"
            - name: REDIS_URL
              value: redis://scitt-redis:6379
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: scitt-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: scitt
  namespace: contract-management
spec:
  selector:
    app: scitt
  ports:
    - port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scitt-redis
  namespace: contract-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scitt-redis
  template:
    metadata:
      labels:
        app: scitt-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: scitt-redis
  namespace: contract-management
spec:
  selector:
    app: scitt-redis
  ports:
    - port: 6379
      targetPort: 6379
