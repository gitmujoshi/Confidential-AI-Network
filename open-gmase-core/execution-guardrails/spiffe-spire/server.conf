server {
  bind_address = "0.0.0.0"
  bind_port = "8081"
  trust_domain = "open-gmase.local"
  data_dir = "/opt/spire/data/server"
  log_level = "INFO"
  ca_ttl = "24h"
  default_x509_svid_ttl = "1h"

  plugins {
    DataStore "sql" {
      plugin_data {
        database_type = "sqlite3"
        connection_string = "/opt/spire/data/server/datastore.sqlite3"
      }
    }

    NodeAttestor "join_token" {
      plugin_data {}
    }

    KeyManager "memory" {
      plugin_data {}
    }

    UpstreamAuthority "disk" {
      plugin_data {
        # Dev-only: SPIRE generates a self-signed CA when keys are absent in some setups;
        # for durable local trust, mount a generated CA. See SPIRE docs.
        cert_file_path = "/opt/spire/conf/server/dummy_upstream_ca.crt"
        key_file_path = "/opt/spire/conf/server/dummy_upstream_ca.key"
      }
    }
  }
}
