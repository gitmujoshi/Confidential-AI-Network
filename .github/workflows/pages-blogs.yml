name: Deploy security blog (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "docs/blogs/**"
      - "docs/guides/lifecycle-user-guide/**"
      - "docs/guides/gmase-integration/**"
      - ".github/workflows/pages-blogs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-blogs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync lifecycle screenshots into blog assets
        run: |
          mkdir -p docs/blogs/assets/lifecycle
          cp -f docs/guides/lifecycle-user-guide/screenshots/*.png \
            docs/blogs/assets/lifecycle/
          ls -la docs/blogs/assets/lifecycle | head -40

      - name: Sync Open-GMASE integration screenshots into blog assets
        run: |
          mkdir -p docs/blogs/assets/gmase
          if ls docs/guides/gmase-integration/screenshots/*.png >/dev/null 2>&1; then
            cp -f docs/guides/gmase-integration/screenshots/*.png docs/blogs/assets/gmase/
          fi
          ls -la docs/blogs/assets/gmase || true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: docs/blogs

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll
        working-directory: docs/blogs
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/blogs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
