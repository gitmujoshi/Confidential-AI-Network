name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    
    services:
      # Start PostgreSQL for tests
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contract_management_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Build shared value-objects package
        run: |
          cd shared/valueObjects
          npm ci
          npm run build

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npm run test:e2e:install

      - name: Setup database
        run: |
          cd backend
          npm run migrate
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: contract_management_test
          DB_USER: postgres
          DB_PASSWORD: postgres

      - name: Start backend server
        run: |
          cd backend
          npm start &
          sleep 30
        env:
          NODE_ENV: test
          PORT: 5001
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: contract_management_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: test-jwt-secret-key-for-integration-tests
          KEYCLOAK_ENABLED: false
          HUGGINGFACE_INTEGRATION_ENABLED: true

      - name: Run E2E tests
        run: |
          cd frontend
          npm run test:e2e
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 30

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: frontend/test-results/
          retention-days: 30

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              const resultsPath = 'frontend/test-results/e2e-results.json';
              if (fs.existsSync(resultsPath)) {
                const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
                const stats = results.stats;
                
                const comment = `## E2E Test Results ✅
                
                **Summary:**
                - Total Tests: ${stats.total}
                - Passed: ${stats.passed}
                - Failed: ${stats.failed}
                - Skipped: ${stats.skipped}
                - Duration: ${Math.round(stats.duration / 1000)}s
                
                **Status:** ${stats.failed > 0 ? '❌ Failed' : '✅ Passed'}
                
                ${stats.failed > 0 ? 'Check the uploaded artifacts for detailed failure information.' : ''}`;
                
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            } catch (error) {
              console.log('Could not read test results:', error.message);
            } 