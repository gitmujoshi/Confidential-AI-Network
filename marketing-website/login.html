<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Required - ContractFlow Pro</title>
    <meta name="description" content="Authentication required to access ContractFlow Pro resources.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <!-- Authentication Page -->
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-logo">
                <i class="fas fa-file-contract fa-3x text-primary mb-3"></i>
                <h2 class="text-primary">ContractFlow Pro</h2>
                <p class="text-muted">Access Required</p>
            </div>
            
            <div class="auth-form">
                <h4 class="mb-3">Authentication Required</h4>
                <p class="text-muted mb-4">Please enter your credentials to access the requested resource.</p>
                
                <form id="authForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" class="form-control form-control-lg" 
                               placeholder="Enter username" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-control form-control-lg" 
                               placeholder="Enter password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                        <i class="fas fa-sign-in-alt me-2"></i>Sign In
                    </button>
                    
                    <div id="error-message" class="alert alert-danger" style="display: none;">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <span id="error-text"></span>
                    </div>
                </form>
                
                <div class="auth-footer">
                    <small class="text-muted">
                        <i class="fas fa-shield-alt me-1"></i>
                        Secure access to ContractFlow Pro resources
                    </small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
