<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#ffffff"/>
  
  <!-- Browser Header -->
  <rect x="0" y="0" width="600" height="40" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1"/>
  
  <!-- Browser Dots -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#27ca3f"/>
  
  <!-- Browser Title -->
  <text x="300" y="25" font-family="Arial, sans-serif" font-size="14" fill="#6c757d" text-anchor="middle">ContractFlow Pro Dashboard</text>
  
  <!-- Sidebar -->
  <rect x="0" y="40" width="150" height="360" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1"/>
  
  <!-- Sidebar Items -->
  <rect x="10" y="60" width="130" height="30" fill="#007bff" rx="4"/>
  <text x="20" y="80" font-family="Arial, sans-serif" font-size="12" fill="white">📊 Dashboard</text>
  
  <rect x="10" y="100" width="130" height="30" fill="#f8f9fa" rx="4"/>
  <text x="20" y="120" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">📄 Contracts</text>
  
  <rect x="10" y="140" width="130" height="30" fill="#f8f9fa" rx="4"/>
  <text x="20" y="160" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">👥 Users</text>
  
  <rect x="10" y="180" width="130" height="30" fill="#f8f9fa" rx="4"/>
  <text x="20" y="200" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">📈 Analytics</text>
  
  <rect x="10" y="220" width="130" height="30" fill="#f8f9fa" rx="4"/>
  <text x="20" y="240" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">🔐 Security</text>
  
  <rect x="10" y="260" width="130" height="30" fill="#f8f9fa" rx="4"/>
  <text x="20" y="280" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">⚙️ Settings</text>
  
  <!-- Main Content Area -->
  <rect x="150" y="40" width="450" height="360" fill="white"/>
  
  <!-- Content Header -->
  <rect x="160" y="50" width="430" height="40" fill="#f8f9fa" rx="4"/>
  <text x="170" y="75" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#343a40">Contract Overview</text>
  
  <!-- Stats Cards -->
  <rect x="170" y="100" width="120" height="60" fill="#f8f9fa" rx="6" stroke="#e9ecef" stroke-width="1"/>
  <text x="230" y="125" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#007bff" text-anchor="middle">24</text>
  <text x="230" y="145" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Active</text>
  
  <rect x="310" y="100" width="120" height="60" fill="#f8f9fa" rx="6" stroke="#e9ecef" stroke-width="1"/>
  <text x="370" y="125" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#007bff" text-anchor="middle">156</text>
  <text x="370" y="145" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Total</text>
  
  <rect x="450" y="100" width="120" height="60" fill="#f8f9fa" rx="6" stroke="#e9ecef" stroke-width="1"/>
  <text x="510" y="125" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#007bff" text-anchor="middle">$2.4M</text>
  <text x="510" y="145" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Value</text>
  
  <!-- Chart Area -->
  <rect x="170" y="180" width="400" height="200" fill="#f8f9fa" rx="6" stroke="#dee2e6" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Chart Bars -->
  <rect x="190" y="350" width="30" height="120" fill="#007bff" rx="2"/>
  <rect x="240" y="320" width="30" height="150" fill="#007bff" rx="2"/>
  <rect x="290" y="340" width="30" height="130" fill="#007bff" rx="2"/>
  <rect x="340" y="300" width="30" height="170" fill="#007bff" rx="2"/>
  <rect x="390" y="330" width="30" height="140" fill="#007bff" rx="2"/>
  <rect x="440" y="310" width="30" height="160" fill="#007bff" rx="2"/>
  <rect x="490" y="325" width="30" height="145" fill="#007bff" rx="2"/>
  
  <!-- Chart Labels -->
  <text x="205" y="370" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Jan</text>
  <text x="255" y="370" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Feb</text>
  <text x="305" y="370" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Mar</text>
  <text x="355" y="370" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Apr</text>
  <text x="405" y="370" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">May</text>
  <text x="455" y="370" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Jun</text>
  <text x="505" y="370" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Jul</text>
  
  <!-- Chart Title -->
  <text x="370" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6c757d" text-anchor="middle">📊 Analytics Chart</text>
  
  <!-- Additional UI Elements -->
  <circle cx="570" cy="20" r="8" fill="#007bff"/>
  <text x="570" y="25" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">⚙️</text>
  
  <!-- Status Indicators -->
  <circle cx="580" cy="60" r="4" fill="#28a745"/>
  <text x="570" y="65" font-family="Arial, sans-serif" font-size="8" fill="#28a745">Online</text>
</svg> 