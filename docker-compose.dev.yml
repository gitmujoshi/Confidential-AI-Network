services:
  # PostgreSQL Database for Application
  ***REMOVED-DB_PASSWORD***-app:
    image: ***REMOVED-DB_PASSWORD***:15
    container_name: ***REMOVED-DB_PASSWORD***-app-dev
    env_file:
      - config.env
      - secrets.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ***REMOVED-DB_PASSWORD***_app_data:/var/lib/***REMOVED-DB_PASSWORD***ql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ***REMOVED-DB_PASSWORD***"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cms-network

  # PostgreSQL Database for Keycloak
  ***REMOVED-DB_PASSWORD***-***REMOVED-KEYCLOAK_DB_PASSWORD***:
    image: ***REMOVED-DB_PASSWORD***:15
    container_name: ***REMOVED-DB_PASSWORD***-***REMOVED-KEYCLOAK_DB_PASSWORD***-dev
    env_file:
      - config.env
      - secrets.env
    environment:
      POSTGRES_DB: ***REMOVED-KEYCLOAK_DB_PASSWORD***
      POSTGRES_USER: ***REMOVED-KEYCLOAK_DB_PASSWORD***
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "${KEYCLOAK_DB_PORT}:5432"
    volumes:
      - ***REMOVED-DB_PASSWORD***_***REMOVED-KEYCLOAK_DB_PASSWORD***_data:/var/lib/***REMOVED-DB_PASSWORD***ql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ***REMOVED-KEYCLOAK_DB_PASSWORD***"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cms-network

  # Keycloak Identity and Access Management
  ***REMOVED-KEYCLOAK_DB_PASSWORD***:
    image: quay.io/***REMOVED-KEYCLOAK_DB_PASSWORD***/***REMOVED-KEYCLOAK_DB_PASSWORD***:23.0
    container_name: ***REMOVED-KEYCLOAK_DB_PASSWORD***-dev
    env_file:
      - config.env
      - secrets.env
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: ***REMOVED-DB_PASSWORD***
      KC_DB_URL: jdbc:***REMOVED-DB_PASSWORD***ql://***REMOVED-DB_PASSWORD***-***REMOVED-KEYCLOAK_DB_PASSWORD***:5432/***REMOVED-KEYCLOAK_DB_PASSWORD***
      KC_DB_USERNAME: ***REMOVED-KEYCLOAK_DB_PASSWORD***
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_PROXY: edge
      KC_LOG_LEVEL: INFO
    ports:
      - "${KEYCLOAK_PORT}:8080"
    depends_on:
      ***REMOVED-DB_PASSWORD***-***REMOVED-KEYCLOAK_DB_PASSWORD***:
        condition: service_healthy
    restart: unless-stopped
    command: start-dev
    healthcheck:
      test: ["CMD-SHELL", "curl -f ${KEYCLOAK_HEALTH_URL} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - cms-network

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend-dev
    env_file:
      - config.env
      - secrets.env
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DB_HOST: ***REMOVED-DB_PASSWORD***-app
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: https://***REMOVED-KEYCLOAK_DB_PASSWORD***:8443
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CORS_ORIGIN: ${CORS_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_logs:/app/logs
    depends_on:
      ***REMOVED-DB_PASSWORD***-app:
        condition: service_healthy
      ***REMOVED-KEYCLOAK_DB_PASSWORD***:
        condition: service_healthy
    restart: unless-stopped
    command: npm run dev
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cms-network

  # Frontend React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend-dev
    env_file:
      - config.env
      - secrets.env
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      REACT_APP_API_URL: http://localhost:${BACKEND_PORT}
      REACT_APP_KEYCLOAK_URL: ${KEYCLOAK_URL}
      REACT_APP_KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      REACT_APP_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      CHOKIDAR_USEPOLLING: true
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    command: npm start
    healthcheck:
      test: ["CMD-SHELL", "curl -f ${FRONTEND_HEALTH_URL} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cms-network

  # Redis for Caching (Optional)
  redis:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cms-network

  # Mailhog for Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog-dev
    ports:
      - "${MAILHOG_SMTP_PORT}:1025"  # SMTP
      - "${MAILHOG_WEB_PORT}:8025"  # Web UI
    restart: unless-stopped
    networks:
      - cms-network

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: nginx-dev
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
      - ***REMOVED-KEYCLOAK_DB_PASSWORD***
    restart: unless-stopped
    networks:
      - cms-network

  # Development Tools Container
  dev-tools:
    build:
      context: .
      dockerfile: Dockerfile.dev-tools
    container_name: dev-tools
    environment:
      NODE_ENV: development
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    command: tail -f /dev/null
    networks:
      - cms-network

  # pgAdmin (PostgreSQL UI admin console)
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin-dev
    env_file:
      - config.env
      - secrets.env
    environment:
      # Set these in secrets.env (recommended) or export before docker-compose up:
      # PGADMIN_DEFAULT_EMAIL=admin@example.com
      # PGADMIN_DEFAULT_PASSWORD=StrongPassword123!
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - ***REMOVED-DB_PASSWORD***-app
      - ***REMOVED-DB_PASSWORD***-***REMOVED-KEYCLOAK_DB_PASSWORD***
    restart: unless-stopped
    networks:
      - cms-network

volumes:
  ***REMOVED-DB_PASSWORD***_app_data:
  ***REMOVED-DB_PASSWORD***_***REMOVED-KEYCLOAK_DB_PASSWORD***_data:
  redis_data:
  backend_logs:
  pgadmin_data:

networks:
  cms-network:
    driver: bridge
