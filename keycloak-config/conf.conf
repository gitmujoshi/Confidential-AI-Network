# Keycloak Development Configuration
# This file disables HTTPS requirement for local development

# Disable HTTPS requirement
hostname-strict-https=false
hostname-strict=false
http-enabled=true

# Development mode settings
profile=dev
http-relative-path=/

# Database settings
db=***REMOVED-DB_PASSWORD***
db-url=jdbc:***REMOVED-DB_PASSWORD***ql://***REMOVED-DB_PASSWORD***:5432/***REMOVED-KEYCLOAK_DB_PASSWORD***
db-username=***REMOVED-KEYCLOAK_DB_PASSWORD***
db-password=***REMOVED-KEYCLOAK_DB_PASSWORD***

# Disable strict hostname validation
hostname-strict=false
hostname-strict-https=false

# Enable HTTP (disable HTTPS requirement)
http-enabled=true
https-protocols=TLSv1.2,TLSv1.3

# Development-specific settings
spi-login-protocol-openid-connect-legacy-logout-redirect-uri=true
