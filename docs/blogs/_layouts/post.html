---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.categories %} · {{ page.categories | join: ", " }}{% endif %}</p>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
<p class="back"><a href="{{ '/' | relative_url }}">← All posts</a></p>
