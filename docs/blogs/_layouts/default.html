<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  {% seo %}
  {% feed_meta %}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/product-tour/' | relative_url }}">Product tour</a>
        <a href="{{ '/#notes' | relative_url }}">Notes</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="https://github.com/gitmujoshi/Confidential-AI-Network">GitHub</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>Confidential AI Network — governed collaboration for AI training. Specs in the <a href="https://github.com/gitmujoshi/Confidential-AI-Network/tree/main/docs">docs/</a> tree; security notes on this site.</p>
    </div>
  </footer>
</body>
</html>
