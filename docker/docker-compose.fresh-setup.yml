services:
  # Main application database
  postgres-app:
    image: postgres:15
    container_name: postgres-app
    environment:
      POSTGRES_DB: contract_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
    networks:
      - cms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contract_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak database
  postgres-keycloak:
    image: postgres:15
    container_name: postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5433:5432"
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - cms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak service
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    container_name: keycloak-cms
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME_STRICT: false
      KC_HTTPS_ENABLED: true
      KC_HTTP_ENABLED: false
      KC_HEALTH_ENABLED: true
      KC_PROXY: edge
      KC_SPI_LOGIN_PROTOCOL_OPENID_CONNECT_LEGACY_LOGOUT_REDIRECT_URI: true
      # HTTPS configuration
      KC_HTTPS_PROTOCOLS: TLSv1.2,TLSv1.3
      KC_HTTPS_CIPHER_SUITES: TLS_AES_128_GCM_SHA256,TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/server.key
    command: start-dev
    ports:
      - "8443:8443"
    volumes:
      - postgres_keycloak_data:/opt/keycloak/data
      - ./keycloak-config:/opt/keycloak/conf
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    networks:
      - cms-network
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8443/realms/master"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_app_data:
    driver: local
  postgres_keycloak_data:
    driver: local

networks:
  cms-network:
    driver: bridge
