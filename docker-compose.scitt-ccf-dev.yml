version: '3.8'

services:
  scitt-ccf-node:
    image: scitt-ccf-ledger:latest
    container_name: scitt-ccf-node-dev
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./deployment/scitt-ccf-data:/data
    networks:
      - cms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/governance/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  scitt-ccf-monitor:
    image: scitt-ccf-monitor:latest
    container_name: scitt-ccf-monitor-dev
    depends_on:
      scitt-ccf-node:
        condition: service_healthy
    environment:
      - SCITT_CCF_NODE_URL=http://scitt-ccf-node:8000
    networks:
      - cms-network

  scitt-ccf-dashboard:
    image: scitt-ccf-dashboard:latest
    container_name: scitt-ccf-dashboard-dev
    ports:
      - "8082:8080"
    depends_on:
      - scitt-ccf-node
    networks:
      - cms-network

  scitt-ccf-redis:
    image: redis:7-alpine
    container_name: scitt-ccf-redis-dev
    ports:
      - "6379:6379"
    networks:
      - cms-network

  scitt-ccf-***REMOVED-DB_PASSWORD***:
    image: ***REMOVED-DB_PASSWORD***:15
    container_name: scitt-ccf-***REMOVED-DB_PASSWORD***-dev
    environment:
      POSTGRES_DB: scitt_ccf_dev
      POSTGRES_USER: scitt_user
      POSTGRES_PASSWORD: scitt_pass
    ports:
      - "5434:5432"
    volumes:
      - ./deployment/scitt-ccf-data:/var/lib/***REMOVED-DB_PASSWORD***ql/data
    networks:
      - cms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scitt_user -d scitt_ccf_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  cms-network:
    external: true
