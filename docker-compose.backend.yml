version: '3.8'

services:
  # Main application database
  ***REMOVED-DB_PASSWORD***-app:
    image: ***REMOVED-DB_PASSWORD***:15
    container_name: ***REMOVED-DB_PASSWORD***-app
    environment:
      POSTGRES_DB: contract_management
      POSTGRES_USER: ***REMOVED-DB_PASSWORD***
      POSTGRES_PASSWORD: ***REMOVED-DB_PASSWORD***
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - ***REMOVED-DB_PASSWORD***_app_data:/var/lib/***REMOVED-DB_PASSWORD***ql/data
    networks:
      - cms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ***REMOVED-DB_PASSWORD*** -d contract_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak database
  ***REMOVED-DB_PASSWORD***-***REMOVED-KEYCLOAK_DB_PASSWORD***:
    image: ***REMOVED-DB_PASSWORD***:15
    container_name: ***REMOVED-DB_PASSWORD***-***REMOVED-KEYCLOAK_DB_PASSWORD***
    environment:
      POSTGRES_DB: ***REMOVED-KEYCLOAK_DB_PASSWORD***
      POSTGRES_USER: ***REMOVED-KEYCLOAK_DB_PASSWORD***
      POSTGRES_PASSWORD: ***REMOVED-KEYCLOAK_DB_PASSWORD***
    ports:
      - "5433:5432"
    volumes:
      - ***REMOVED-DB_PASSWORD***_***REMOVED-KEYCLOAK_DB_PASSWORD***_data:/var/lib/***REMOVED-DB_PASSWORD***ql/data
    networks:
      - cms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ***REMOVED-KEYCLOAK_DB_PASSWORD*** -d ***REMOVED-KEYCLOAK_DB_PASSWORD***"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak service
  ***REMOVED-KEYCLOAK_DB_PASSWORD***:
    image: quay.io/***REMOVED-KEYCLOAK_DB_PASSWORD***/***REMOVED-KEYCLOAK_DB_PASSWORD***:26.3.2
    container_name: ***REMOVED-KEYCLOAK_DB_PASSWORD***-cms
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ***REMOVED-KEYCLOAK_ADMIN_PASSWORD***
      KC_DB: ***REMOVED-DB_PASSWORD***
      KC_DB_URL: jdbc:***REMOVED-DB_PASSWORD***ql://***REMOVED-DB_PASSWORD***-***REMOVED-KEYCLOAK_DB_PASSWORD***:5432/***REMOVED-KEYCLOAK_DB_PASSWORD***
      KC_DB_USERNAME: ***REMOVED-KEYCLOAK_DB_PASSWORD***
      KC_DB_PASSWORD: ***REMOVED-KEYCLOAK_DB_PASSWORD***
      KC_HOSTNAME_STRICT: false
      KC_HTTPS_ENABLED: true
      KC_HTTP_ENABLED: false
      KC_HEALTH_ENABLED: true
      KC_PROXY: edge
      KC_SPI_LOGIN_PROTOCOL_OPENID_CONNECT_LEGACY_LOGOUT_REDIRECT_URI: true
      # HTTPS configuration
      KC_HTTPS_PROTOCOLS: TLSv1.2,TLSv1.3
      KC_HTTPS_CIPHER_SUITES: TLS_AES_128_GCM_SHA256,TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256
      KC_HTTPS_CERTIFICATE_FILE: /opt/***REMOVED-KEYCLOAK_DB_PASSWORD***/conf/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/***REMOVED-KEYCLOAK_DB_PASSWORD***/conf/server.key
    command: start-dev
    ports:
      - "8443:8443"
    volumes:
      - ***REMOVED-DB_PASSWORD***_***REMOVED-KEYCLOAK_DB_PASSWORD***_data:/opt/***REMOVED-KEYCLOAK_DB_PASSWORD***/data
      - ./***REMOVED-KEYCLOAK_DB_PASSWORD***-config:/opt/***REMOVED-KEYCLOAK_DB_PASSWORD***/conf
    depends_on:
      ***REMOVED-DB_PASSWORD***-***REMOVED-KEYCLOAK_DB_PASSWORD***:
        condition: service_healthy
    networks:
      - cms-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider https://localhost:8443/realms/master || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend service
  backend:
    build: ./backend
    container_name: cms-backend
    environment:
      - DB_HOST=***REMOVED-DB_PASSWORD***-app
      - DB_PORT=5432
      - DB_NAME=contract_management
      - DB_USER=***REMOVED-DB_PASSWORD***
      - DB_PASSWORD=***REMOVED-DB_PASSWORD***
      - PORT=5001
      - NODE_ENV=development
      - JWT_SECRET=***REMOVED-JWT_SECRET***
      - JWT_EXPIRES_IN=24h
      - KEYCLOAK_URL=https://***REMOVED-KEYCLOAK_DB_PASSWORD***-cms:8443
      - KEYCLOAK_REALM=contract-management
      - KEYCLOAK_CLIENT_ID=contract-management-frontend
      - KEYCLOAK_CLIENT_SECRET=
      - KEYCLOAK_ADMIN_USER=admin
      - KEYCLOAK_ADMIN_PASSWORD=***REMOVED-KEYCLOAK_ADMIN_PASSWORD***
      - KEYCLOAK_ENABLED=true
      - CORS_ORIGIN=http://localhost:3000
    ports:
      - "5001:5001"
    depends_on:
      ***REMOVED-DB_PASSWORD***-app:
        condition: service_healthy
      ***REMOVED-KEYCLOAK_DB_PASSWORD***:
        condition: service_healthy
    networks:
      - cms-network
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: node server.js

volumes:
  ***REMOVED-DB_PASSWORD***_app_data:
    driver: local
  ***REMOVED-DB_PASSWORD***_***REMOVED-KEYCLOAK_DB_PASSWORD***_data:
    driver: local

networks:
  cms-network:
    driver: bridge
