version: '3.8'

services:
  ***REMOVED-KEYCLOAK_DB_PASSWORD***:
    image: quay.io/***REMOVED-KEYCLOAK_DB_PASSWORD***/***REMOVED-KEYCLOAK_DB_PASSWORD***:latest
    container_name: ***REMOVED-KEYCLOAK_DB_PASSWORD***-cms
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ***REMOVED-KEYCLOAK_ADMIN_PASSWORD***
      KC_DB: ***REMOVED-DB_PASSWORD***
      KC_DB_URL: jdbc:***REMOVED-DB_PASSWORD***ql://***REMOVED-DB_PASSWORD***:5432/***REMOVED-KEYCLOAK_DB_PASSWORD***
      KC_DB_USERNAME: ***REMOVED-KEYCLOAK_DB_PASSWORD***
      KC_DB_PASSWORD: ***REMOVED-KEYCLOAK_DB_PASSWORD***
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
    command: start-dev
    ports:
      - "8080:8080"
    volumes:
      - ***REMOVED-KEYCLOAK_DB_PASSWORD***_data:/opt/***REMOVED-KEYCLOAK_DB_PASSWORD***/data
      - ./***REMOVED-KEYCLOAK_DB_PASSWORD***-config:/opt/***REMOVED-KEYCLOAK_DB_PASSWORD***/conf
    depends_on:
      - ***REMOVED-DB_PASSWORD***
    networks:
      - cms-network

  ***REMOVED-DB_PASSWORD***:
    image: ***REMOVED-DB_PASSWORD***:15
    container_name: ***REMOVED-DB_PASSWORD***-cms
    environment:
      POSTGRES_DB: ***REMOVED-KEYCLOAK_DB_PASSWORD***
      POSTGRES_USER: ***REMOVED-KEYCLOAK_DB_PASSWORD***
      POSTGRES_PASSWORD: ***REMOVED-KEYCLOAK_DB_PASSWORD***
    volumes:
      - ***REMOVED-DB_PASSWORD***_data:/var/lib/***REMOVED-DB_PASSWORD***ql/data
    ports:
      - "5433:5432"
    networks:
      - cms-network

volumes:
  ***REMOVED-KEYCLOAK_DB_PASSWORD***_data:
    driver: local
  ***REMOVED-DB_PASSWORD***_data:
    driver: local

networks:
  cms-network:
    driver: bridge 