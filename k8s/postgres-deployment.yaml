apiVersion: apps/v1
kind: Deployment
metadata:
  name: ***REMOVED-DB_PASSWORD***
  namespace: contract-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ***REMOVED-DB_PASSWORD***
  template:
    metadata:
      labels:
        app: ***REMOVED-DB_PASSWORD***
    spec:
      containers:
      - name: ***REMOVED-DB_PASSWORD***
        image: ***REMOVED-DB_PASSWORD***:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: contract-management-config
              key: DB_NAME
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: contract-management-config
              key: DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: contract-management-secrets
              key: DB_PASSWORD
        volumeMounts:
        - name: ***REMOVED-DB_PASSWORD***-storage
          mountPath: /var/lib/***REMOVED-DB_PASSWORD***ql/data
      volumes:
      - name: ***REMOVED-DB_PASSWORD***-storage
        persistentVolumeClaim:
          claimName: ***REMOVED-DB_PASSWORD***-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ***REMOVED-DB_PASSWORD***-service
  namespace: contract-management
spec:
  selector:
    app: ***REMOVED-DB_PASSWORD***
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP 