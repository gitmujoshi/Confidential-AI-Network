apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contract-management-ingress
  namespace: contract-management
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - contract-management.example.com
    - api.contract-management.example.com
    - ***REMOVED-KEYCLOAK_DB_PASSWORD***.contract-management.example.com
    secretName: contract-management-tls
  rules:
  - host: contract-management.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000
  - host: api.contract-management.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5000
  - host: ***REMOVED-KEYCLOAK_DB_PASSWORD***.contract-management.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ***REMOVED-KEYCLOAK_DB_PASSWORD***-service
            port:
              number: 8080 