apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchain
  namespace: contract-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blockchain
  template:
    metadata:
      labels:
        app: blockchain
    spec:
      containers:
      - name: hardhat-node
        image: node:18-alpine
        workingDir: /app
        command: ["npx"]
        args: ["hardhat", "node", "--hostname", "0.0.0.0"]
        ports:
        - containerPort: 8545
        volumeMounts:
        - name: blockchain-code
          mountPath: /app
        env:
        - name: NODE_ENV
          value: "production"
      volumes:
      - name: blockchain-code
        configMap:
          name: blockchain-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blockchain-config
  namespace: contract-management
data:
  hardhat.config.js: |
    require("@nomicfoundation/hardhat-toolbox");
    module.exports = {
      solidity: "0.8.19",
      networks: {
        hardhat: {
          hostname: "0.0.0.0"
        }
      }
    };
  package.json: |
    {
      "name": "blockchain",
      "version": "1.0.0",
      "dependencies": {
        "@nomicfoundation/hardhat-toolbox": "^3.0.0",
        "hardhat": "^2.17.0"
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: blockchain-service
  namespace: contract-management
spec:
  selector:
    app: blockchain
  ports:
  - port: 8545
    targetPort: 8545
  type: ClusterIP 